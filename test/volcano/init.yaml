apiVersion: v1
kind: ConfigMap
metadata:
  name: volcano-scheduler-configmap
  namespace: volcano-system
data:
  volcano-scheduler.conf: |
    actions: "enqueue, allocate,#{{ if .preemption }} preempt,#{{ end }} backfill, reclaim"
    tiers:
    - plugins:
      - name: priority
      #{{ if .gang }}
      - name: gang
        enablePreemptable: false
      #{{ end }}
    - plugins:
      - name: predicates
      - name: capacity
        enableHierarchy: true
---
apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
metadata:
  name: benchmark-root
spec:
  parent: root
  reclaimable: true
  capability:
    cpu: #{{ .cpuCapabilityTotal }}
    memory: #{{ .memoryCapabilityTotal }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: human-critical
value: 1000000
globalDefault: false
#{{ if .preemption }}
preemptionPolicy: PreemptLowerPriority
#{{ else }}
preemptionPolicy: Never
#{{ end }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: business-impacting
value: 1000
globalDefault: false
#{{ if .preemption }}
preemptionPolicy: PreemptLowerPriority
#{{ else }}
preemptionPolicy: Never
#{{ end }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: long-term-research
value: 1
globalDefault: false
#{{ if .preemption }}
preemptionPolicy: PreemptLowerPriority
#{{ else }}
preemptionPolicy: Never
#{{ end }}
